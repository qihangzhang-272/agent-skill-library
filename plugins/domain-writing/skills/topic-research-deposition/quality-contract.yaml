      requirement: 事实、来源表述、分析判断、假设、反证和来源冲突被清楚分开，不得以叙事流畅掩盖矛盾
      required: true
      verifier: consumer
      completion:
        answerRefRequired: true
        evidenceRefsRequired: true
        unknownAllowed: false
