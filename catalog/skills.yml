pipelines:
  investment_product_to_research_report:
    title: "投资 / 产品问题到研报"
    workflow_doc: "docs/workflows/investment-product-to-research-report.md"
    sections:
      - investment
      - product
    primary_skills:
      - oss-investment-scorecard
      - ai-product-analyzer
    output_artifacts:
      - "quick note"
      - "case memo"
      - "research report"
      - "IC memo"
      - "DD priority list"
  prd_to_frontend:
    title: "PRD 到前端实现"
    workflow_doc: "docs/workflows/prd-to-frontend.md"
    sections:
      - product
      - frontend-design
      - development-paradigms
    primary_skills:
      - awesome-design-skills-selected-styles
      - typeui-fundamentals
      - taste-skill
      - impeccable-index
      - greensock-gsap-skills
    output_artifacts:
      - "frontend brief"
      - "page type decision"
      - "design strategy"
      - "component plan"
      - "browser acceptance record"

sections:
  investment:
    title: "投资"
    purpose: "VC 投资评估、融资可行性、IC 论述、DD 优先级"
  product:
    title: "产品"
    purpose: "产品分析、案例研究、场景边界、商业模式和竞争定位"
  writing:
    title: "写作"
    purpose: "中文写作、改写、语气修订、作者声音和文稿自然化"
  frontend-design:
    title: "前端设计"
    purpose: "前端设计、UI/UX、视觉风格、设计提示词和界面生成质量控制"
  technology:
    title: "技术"
    purpose: "技术可行性、AI 基础设施、架构判断、工程风险"
  development-paradigms:
    title: "开发范式"
    purpose: "AI Agent Native 开发流程、TDD、review、调试与收敛机制"
  operations:
    title: "运营"
    purpose: "自动化、知识库同步、投稿、治理和协作流程"

