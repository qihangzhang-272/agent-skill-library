version: 2
library: agent-skill-library
principle: "self-cultivated skills stay local; external skills stay as GitHub indexes unless explicitly promoted"

distribution:
  claude_code_marketplace_manifest: ".claude-plugin/marketplace.json"
  claude_code_plugin_index: "catalog/claude-plugins.json"
  claude_code_plugin_root: "plugins/"
  build_script: "scripts/build-claude-plugins.ps1"
  source_of_truth: "skills/ and catalog/; plugins/ is generated distribution output"

plugin_policy:
  default_scope: "self_cultivated_or_curated_index"
  rule: "Only Qihang-cultivated operational skills and Qihang's lightweight external index enter Claude Code plugin distribution."
  current_plugins:
    agent-product:
      skills:
        - ai-product-analyzer
    agent-writing:
      skills:
        - topic-research-deposition
        - qihang-writing-style
    qihang-skill-pack:
      skills:
        - qihang-skill-index

external_index:
  source_of_truth: "skills/qihang-skill-index/references/github-skill-index.md"
  rule: "External skills are GitHub references first. Do not vendor them into skills/ unless Qihang explicitly promotes and rewrites them as self-cultivated capabilities."
  indexed_domains:
    - writing-style
    - wechat-publishing
    - product-investment
    - frontend-design
    - skill-discovery

sections:
  product:
    title: "产品"
    purpose: "产品分析、案例研究、场景边界、商业模式和竞争定位"
  writing:
    title: "写作"
    purpose: "公众号选题、素材沉淀、启航写作风格和文稿定稿"
  operations:
    title: "运营"
    purpose: "技能库治理、外部技能索引、同步、发布和工作流维护"
  investment:
    title: "投资"
    purpose: "投资评估和 DD 方向；外部投资技能只通过索引引用"
  frontend-design:
    title: "前端设计"
    purpose: "设计与 UI 外部能力通过索引选择，不在本仓库保留大包"
  technology:
    title: "技术"
    purpose: "技术可行性、AI 基础设施、架构判断、工程风险"
  development-paradigms:
    title: "开发范式"
    purpose: "AI Agent Native 开发流程、TDD、review、调试与收敛机制"

pipelines:
  wechat_product_research_writing_publish:
    title: "公众号产品 / 选题文章链"
    workflow_doc: "orchestrations/wechat-product-research-writing-publish.json"
    sections:
      - product
      - writing
    primary_skills:
      - topic-research-deposition
      - ai-product-analyzer
      - qihang-writing-style
    external_references:
      - md2wechat via qihang-skill-index
    output_artifacts:
      - "research deposition folder"
      - "product insight memo"
      - "Qihang-style WeChat article"
      - "WeChat draft"
  investment_product_to_research_report:
    title: "产品洞察到投资判断"
    workflow_doc: "docs/workflows/investment-product-to-research-report.md"
    sections:
      - product
      - investment
    primary_skills:
      - ai-product-analyzer
    external_references:
      - oss-investment-scorecard via qihang-skill-index
    output_artifacts:
      - "quick note"
      - "case memo"
      - "research report"
      - "DD question tree"
  prd_to_frontend:
    title: "PRD 到前端实现"
    workflow_doc: "docs/workflows/prd-to-frontend.md"
    sections:
      - product
      - frontend-design
      - development-paradigms
    primary_skills:
      - qihang-skill-index
    external_references:
      - "Anthropic frontend-design"
      - "GSAP skills"
      - "Awesome Design Skills"
      - "TypeUI"
      - "Taste Skill"
      - "Impeccable"
    output_artifacts:
      - "frontend brief"
      - "page type decision"
      - "design source selection"
      - "browser acceptance record"

skills:
  - id: ai-product-analyzer
    title: "AI Product Analyzer"
    section: product
    status: internal
    source_type: user_cultivated_product_insight_skill
    package_path: "skills/ai-product-analyzer/SKILL.md"
    package_support:
      - "skills/ai-product-analyzer/references/business-model.md"
      - "skills/ai-product-analyzer/references/data-agent.md"
      - "skills/ai-product-analyzer/references/narrative-audit.md"
    package_traits:
      - self_contained
      - no_external_path_dependency
      - reference_routed
    plugin_distribution: "agent-product"
    pipeline_role:
      - "wechat_product_research_writing_publish"
      - "investment_product_to_research_report"
    trigger_examples:
      - "分析一下这个 AI 产品"
      - "从 BP 逻辑评估这个产品"
      - "这个产品是好案例、反面教材，还是待观察"
    copy_policy: "internal_user_cultivated_skill_package"
    notes: "启航自培养产品洞察技能；正式保留在本仓库。"

  - id: topic-research-deposition
    title: "Topic Research Deposition"
    section: writing
    status: internal
    source_type: internal_writing_workflow_skill
    package_path: "skills/topic-research-deposition/SKILL.md"
    package_support:
      - "skills/topic-research-deposition/references/platform-commands.md"
      - "skills/topic-research-deposition/references/wechat-viral-logic.md"
      - "skills/topic-research-deposition/references/wechat-extraction.md"
      - "skills/topic-research-deposition/references/quality-checklist.md"
    package_traits:
      - multi_platform_research
      - serial_platform_search
      - source_deposition_only
      - screenshot_evidence
      - handoff_to_qihang_writing_style
    plugin_distribution: "agent-writing"
    pipeline_role:
      - "wechat_product_research_writing_publish"
    trigger_examples:
      - "搜一下这个选题"
      - "第 0 步，先沉淀素材"
      - "把这个主题的 Twitter、Reddit、网页和公众号资料拉下来"
    copy_policy: "internal_workflow_skill"
    notes: "公众号写作第 0 步，只负责跨平台搜索、全文素材落盘和截图留证。"

  - id: qihang-writing-style
    title: "Qihang Writing Style"
    section: writing
    status: internal
    source_type: user_calibrated_writing_skill
    package_path: "skills/qihang-writing-style/SKILL.md"
    package_support:
      - "skills/qihang-writing-style/references/writing-process.md"
      - "skills/qihang-writing-style/references/voice-quality.md"
      - "skills/qihang-writing-style/references/ai-flavor-checklist.md"
      - "skills/qihang-writing-style/references/style-rhythm.md"
      - "skills/qihang-writing-style/references/skill-methodology-writing.md"
    package_traits:
      - reference_routed
      - user_style_calibrated
      - lightweight_style_guidance
    plugin_distribution: "agent-writing"
    pipeline_role:
      - "wechat_product_research_writing_publish"
    trigger_examples:
      - "按我的公众号风格写"
      - "这篇不像我的风格"
      - "这篇太方、短句太多、太像 AI"
    copy_policy: "internal_user_calibrated_skill"
    notes: "启航自培养写作风格技能；正式保留在本仓库。"

  - id: qihang-skill-index
    title: "Qihang Skill Index"
    section: operations
    status: internal_index
    source_type: user_curated_external_github_index
    package_path: "skills/qihang-skill-index/SKILL.md"
    package_support:
      - "skills/qihang-skill-index/references/github-skill-index.md"
    package_traits:
      - lightweight_index
      - no_external_code_copy
      - github_source_reference
    plugin_distribution: "qihang-skill-pack"
    pipeline_role:
      - "wechat_product_research_writing_publish"
      - "investment_product_to_research_report"
      - "prd_to_frontend"
    trigger_examples:
      - "找一下之前收录过的外部技能"
      - "这个外部 skill 要不要装"
      - "把外部技能改成 GitHub 索引"
      - "前端设计可以参考哪些外部技能源"
    copy_policy: "internal_lightweight_index"
    notes: "收纳非启航自培养技能的 GitHub 索引；不保留外部技能正文。"
