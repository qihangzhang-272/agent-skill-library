apiVersion: asl-wep/v0.4.0
kind: ModeProjection
metadata:
  id: investment-desk
spec:
  skills:
    - agent-reach
    - investment-research
    - investment-ai-product-judgment
    - investment-competitive-landscape
    - investment-unit-economics
    - investment-scorecard
    - investment-financial-model-builder
    - investment-valuation-returns
    - investment-dd
    - investment-thesis-tracking
    - investment-ic-memo-writer
    - investment-chart-pack
    - investment-visual-report
  architecture:
    nodes:
      - skill: agent-reach
        title: "网络检索与读取"
        note: "从公开网络获取资料，按平台选择读取与查证方式。"
      - skill: investment-research
        title: "事实研究"
        note: "收集可定位来源的公司与产品事实，不代写投资结论。"
      - skill: investment-ai-product-judgment
        title: "AI 产品投资判断"
        note: "评估 AI 产品解决的问题、差异性与投资意义。"
      - skill: investment-competitive-landscape
        title: "竞争格局"
        note: "比较竞品、市场位置与竞争优势的证据。"
      - skill: investment-unit-economics
        title: "单位经济"
        note: "拆解单个业务单位的收入、成本与可持续性。"
      - skill: investment-scorecard
        title: "投资评分"
        note: "整合判断并评分，显露弱项和待核验风险。"
      - skill: investment-financial-model-builder
        title: "财务模型"
        note: "以有依据的输入构建可审计的财务模型。"
      - skill: investment-valuation-returns
        title: "估值与回报"
        note: "解释估值、回报区间及关键假设的影响。"
      - skill: investment-dd
        title: "尽职调查"
        note: "把投资疑点转成尽调问题与证据检查。"
      - skill: investment-thesis-tracking
        title: "论点跟踪"
        note: "维护可证伪的论点、观察指标与变化触发项。"
      - skill: investment-ic-memo-writer
        title: "投资备忘录"
        note: "把研究与判断组织成决策可用的投资备忘录。"
      - skill: investment-chart-pack
        title: "投资图表"
        note: "生成来源明确、口径一致的投资图表。"
      - skill: investment-visual-report
        title: "投资视觉报告"
        note: "将审定分析与图表组织成可阅读的视觉报告。"
    shared: ["agent-reach"]
    paradigms:
      - id: screening
        title: "项目初筛与反证"
        description: "以投资问题选择研究维度。事实包支持产品、竞争和经济性判断；这些维度可以并行补充。评分用于暴露弱点，缺口返回研究，不因有评分就自动形成投资建议。"
        skills: ["investment-research","investment-ai-product-judgment","investment-competitive-landscape","investment-unit-economics","investment-scorecard"]
        edges: [{"from":"investment-research","to":"investment-ai-product-judgment","label":"产品事实与缺口"},{"from":"investment-research","to":"investment-competitive-landscape","label":"竞品与市场证据"},{"from":"investment-research","to":"investment-unit-economics","label":"收入与成本证据"},{"from":"investment-ai-product-judgment","to":"investment-scorecard","label":"产品判断"},{"from":"investment-competitive-landscape","to":"investment-scorecard","label":"竞争判断"},{"from":"investment-unit-economics","to":"investment-scorecard","label":"经济性判断"},{"from":"investment-scorecard","to":"investment-research","label":"需核验的反证"}]
      - id: valuation
        title: "模型与回报推演"
        description: "只在已获准且有依据的输入上建模，区分事实和假设。模型支持估值，敏感性结果可以反过来修改假设。图表用于解释数字，不替代估值判断。"
        skills: ["investment-unit-economics","investment-financial-model-builder","investment-valuation-returns","investment-chart-pack"]
        edges: [{"from":"investment-unit-economics","to":"investment-financial-model-builder","label":"经营假设"},{"from":"investment-financial-model-builder","to":"investment-valuation-returns","label":"可核查的模型"},{"from":"investment-valuation-returns","to":"investment-financial-model-builder","label":"敏感性与假设反馈"},{"from":"investment-valuation-returns","to":"investment-chart-pack","label":"回报区间"}]
      - id: diligence-memo
        title: "尽调、决策材料与跟踪"
        description: "从明确疑点或现有投资论点开始。尽调结果进入备忘录；图表和视觉报告按交付需要补充。后续论点变化会触发有针对性的尽调，不自动重跑整套研究。"
        skills: ["investment-dd","investment-thesis-tracking","investment-ic-memo-writer","investment-chart-pack","investment-visual-report"]
        edges: [{"from":"investment-dd","to":"investment-ic-memo-writer","label":"证据与未决问题"},{"from":"investment-ic-memo-writer","to":"investment-thesis-tracking","label":"待持续验证的论点"},{"from":"investment-thesis-tracking","to":"investment-dd","label":"新疑点与触发事项"},{"from":"investment-ic-memo-writer","to":"investment-visual-report","label":"审定叙事"},{"from":"investment-chart-pack","to":"investment-visual-report","label":"证据图表"}]
