apiVersion: asl-wep/v0.1.0-draft.3
kind: SkillQualityContract
metadata:
  id: investment-scorecard.quality
spec:
  builtFrom:
    - SKILL.md
    - references/cases/hugging-face.md
    - references/cases/inferact-vllm.md
    - references/deal-screening.md
    - references/oss-investment-scorecard.md
    - references/scored-examples.md
    - references/template/evaluation-template.md
  obligations:
    - id: decision-basis-and-adaptation
      requirement: 声明 as-of 日期、币种和单位、投资问题、阶段、已提供的基金标准，以及 OSS 或非 OSS 的五维框架适配
      required: true
    - id: macro-gate
      requirement: 逐项完成 macro gate；Q1/Q2 的 NO 与 Q3 的风险语义不得混淆，并说明是否只保留诊断性评分
      required: true
    - id: five-dimension-evidence-matrix
      requirement: 对生态或采用、团队与全球化、技术护城河与定位、商业化与 PMF、资本退出路径五维逐项连接证据和反证
      required: true
    - id: weighted-arithmetic
      requirement: 权重、原始分、加权分和总分计算可复核，缺失数据的处理不制造虚假精度
      required: true
    - id: vetoes-and-reconciliation
      requirement: 只使用明示的一票否决项，并把否决、重大风险、总分和基金标准显式协调
      required: true
    - id: recommendation-dd-watch
      requirement: 形成一致的建议、DD 优先级和可测量跟踪触发器，并列出会改变结论的证据
      required: true
    - id: missing-information-handling
      requirement: 经合理查找仍不可得的信息必须用业务语言写清缺失事项、不可得原因、对结论的影响、当前保守处理和重新核验条件后继续；缺失数据不得被写成零或虚假精确分数
      required: true
  artifact:
    path: 06-investment-scorecard.md
    mediaType: text/markdown
    independent: true
