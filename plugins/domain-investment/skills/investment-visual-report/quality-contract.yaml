apiVersion: asl-wep/v0.1.0-draft.3
kind: SkillQualityContract
metadata:
  id: investment-visual-report.quality
spec:
  builtFrom:
    - SKILL.md
    - assets/report-template.html
    - references/components.md
    - references/design-system.md
    - references/quality-checklist.md
  obligations:
    - id: memo-sole-conclusion
      requirement: 只读取并转换 10-ic-memo；所有内容、结论、建议、评分和措辞强度均来自 Memo，不读取 01–09 补洞，也不创建第三套投资结论
      required: true
    - id: verdict-score-unit-fidelity
      requirement: 忠实保留 Memo 的推进（Proceed）、有条件推进（Conditional proceed）、观察（Watch）或放弃（Pass），以及分数、估值、回报、单位、日期、情景、缺口和限制
      required: true
    - id: thirteen-section-completeness
      requirement: 完整承接 Memo 的十三个投资人章节，不压薄或用视觉组件替代正文
      required: true
    - id: investor-readable-chinese
      requirement: 章节名、标签和解释面向中文投资人；专业缩写和英文投资术语沿用 Memo 的中文解释，不以内部工程术语代替业务表达
      required: true
    - id: clickable-external-sources
      requirement: 完整保留 Memo 中的真实外部 URL，并在 HTML 中使用可读锚文本、可点击链接以及安全的新窗口属性
      required: true
    - id: business-body-without-runtime-audit
      requirement: HTML 只呈现投资业务正文，不展示内部工作区元数据、检查过程、尝试记录或运行证明
      required: true
    - id: offline-single-file-structure
      requirement: 输出为指定路径的单一 HTML，CSS 全部内联，无运行时外部依赖，并包含十三个命名 section；外部来源链接可在联网时点击
      required: true
    - id: visual-usability-and-semantic-color
      requirement: 桌面与移动端均可读、无关键溢出、具备基本可访问性，且 verdict class 和语义色忠于 Memo
      required: true
  artifact:
    path: 11-visual-report.html
    mediaType: text/html
    independent: true
