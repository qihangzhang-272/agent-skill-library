version: 4
library: agent-skill-library
principle: "self-cultivated skills stay local; external skills and source repositories stay as repo-root GitHub indexes unless explicitly promoted"

distribution:
  claude_code_marketplace_manifest: ".claude-plugin/marketplace.json"
  claude_code_plugin_index: "catalog/claude-plugins.json"
  claude_code_plugin_root: "plugins/"
  build_script: "scripts/build-claude-plugins.ps1"
  source_of_truth: "skills/ and catalog/; plugins/ is generated distribution output"

plugin_policy:
  default_scope: "self_cultivated_or_curated_index"
  rule: "Only Qihang-cultivated operational skills and Qihang's lightweight external index enter Claude Code plugin distribution."
  current_plugins:
    agent-product:
      skills:
        - ai-product-analyzer
    agent-writing:
      skills:
        - topic-research-deposition
        - qihang-writing-style
    qihang-skill-pack:
      skills:
        - qihang-skill-index
        - qihang-workflow-orchestrator

external_index:
  source_of_truth: "skills/qihang-skill-index/references/github-skill-index.md"
  url_rule: "Use GitHub repository root URLs by default. Do not force links to SKILL.md subdirectories unless a workflow needs that exact path."
  validation_rule: "Repo roots must resolve with git ls-remote before being treated as indexed sources."
  indexed_domains:
    - writing-style
    - wechat-publishing
    - product-investment
    - frontend-design
    - research-web-reach
    - skill-discovery

pipelines:
  topic_writing_md2wechat:
    title: "选题沉淀到公众号草稿箱"
    workflow_doc: "orchestrations/topic-writing-md2wechat.json"
    primary_skills:
      - topic-research-deposition
      - qihang-writing-style
      - qihang-skill-index
    workflow_skill: qihang-workflow-orchestrator
    external_references:
      - md2wechat via qihang-skill-index
      - agent-reach via qihang-skill-index
    output_artifacts:
      - "research deposition folder"
      - "Qihang-style WeChat article"
      - "WeChat layout artifact"
      - "WeChat draft status"
  product_analysis:
    title: "产品分析到可视化、前端 brief、投资研报或 OSS investment"
    workflow_docs:
      - "docs/workflows/prd-to-frontend.md"
      - "docs/workflows/investment-product-to-research-report.md"
    primary_skills:
      - topic-research-deposition
      - ai-product-analyzer
      - qihang-skill-index
    workflow_skill: qihang-workflow-orchestrator
    product_investment_chain:
      - product-and-investment-view
      - research-report
      - visual-report
    explicit_stop_points:
      - text-only memo
      - frontend brief
    external_references:
      - "TypeUI"
      - "Anthropic skills"
      - "Awesome Design Skills"
      - "Taste Skill"
      - "Impeccable"
      - "shadcn/ui"
      - "Magic UI"
      - oss-investment-scorecard via qihang-skill-index
    output_artifacts:
      - "product insight"
      - "visual report brief or static HTML plan"
      - "frontend source selection"
      - "investment judgment"
      - "research report"
      - "DD question tree"
      - "watch triggers"

skills:
  - id: ai-product-analyzer
    title: "AI Product Analyzer"
    status: internal
    source_type: user_cultivated_product_insight_skill
    package_path: "skills/ai-product-analyzer/SKILL.md"
    package_support:
      - "skills/ai-product-analyzer/references/business-model.md"
      - "skills/ai-product-analyzer/references/data-agent.md"
      - "skills/ai-product-analyzer/references/narrative-audit.md"
    package_traits:
      - self_contained
      - no_external_path_dependency
      - reference_routed
    plugin_distribution: "agent-product"
    pipeline_role:
      - "product_analysis"
    trigger_examples:
      - "分析一下这个 AI 产品"
      - "从 BP 逻辑评估这个产品"
      - "这个产品是好案例、反面教材，还是待观察"
    copy_policy: "internal_user_cultivated_skill_package"
    notes: "启航自培养产品洞察技能；正式保留在本仓库。"

  - id: topic-research-deposition
    title: "Topic Research Deposition"
    status: internal
    source_type: internal_research_deposition_skill
    package_path: "skills/topic-research-deposition/SKILL.md"
    package_support:
      - "skills/topic-research-deposition/references/agent-reach-search.md"
      - "skills/topic-research-deposition/references/platform-commands.md"
      - "skills/topic-research-deposition/references/product-investment-research.md"
      - "skills/topic-research-deposition/references/wechat-writing-research.md"
      - "skills/topic-research-deposition/references/wechat-viral-logic.md"
      - "skills/topic-research-deposition/references/wechat-extraction.md"
      - "skills/topic-research-deposition/references/quality-checklist.md"
    package_traits:
      - generic_research_deposition
      - agent_reach_default
      - mode_routed
      - reference_routed
      - source_deposition_only
      - screenshot_evidence
      - handoff_to_qihang_writing_style
    plugin_distribution: "agent-writing"
    pipeline_role:
      - "topic_writing_md2wechat"
      - "product_analysis"
    trigger_examples:
      - "搜一下这个选题"
      - "第 0 步，先沉淀素材"
      - "用 agent-reach 覆盖 Twitter/Reddit/网页/公众号等素材面"
      - "产品分析前先把事实和证据沉淀下来"
    copy_policy: "internal_workflow_skill"
    notes: "通用搜索、事实收集和素材沉淀技能；agent-reach 是默认 reach layer，Twitter/Reddit/Exa/微信等只是覆盖面。公众号经验保留在 wechat-writing-research mode。"

  - id: qihang-writing-style
    title: "Qihang Writing Style"
    status: internal
    source_type: user_calibrated_writing_skill
    package_path: "skills/qihang-writing-style/SKILL.md"
    package_support:
      - "skills/qihang-writing-style/references/writing-process.md"
      - "skills/qihang-writing-style/references/voice-quality.md"
      - "skills/qihang-writing-style/references/ai-flavor-checklist.md"
      - "skills/qihang-writing-style/references/style-rhythm.md"
      - "skills/qihang-writing-style/references/skill-methodology-writing.md"
    package_traits:
      - reference_routed
      - user_style_calibrated
      - lightweight_style_guidance
    plugin_distribution: "agent-writing"
    pipeline_role:
      - "topic_writing_md2wechat"
    trigger_examples:
      - "按我的公众号风格写"
      - "这篇不像我的风格"
      - "这篇太方、短句太多、太像 AI"
    copy_policy: "internal_user_calibrated_skill"
    notes: "启航自培养写作风格技能；正式保留在本仓库。"

  - id: qihang-skill-index
    title: "Qihang Skill Index"
    status: internal_index
    source_type: user_curated_external_github_repo_index
    package_path: "skills/qihang-skill-index/SKILL.md"
    package_support:
      - "skills/qihang-skill-index/references/github-skill-index.md"
    package_traits:
      - lightweight_index
      - no_external_code_copy
      - github_repo_root_reference
    plugin_distribution: "qihang-skill-pack"
    pipeline_role:
      - "topic_writing_md2wechat"
      - "product_analysis"
    trigger_examples:
      - "找一下之前收录过的外部技能"
      - "这个外部 repo 要不要装"
      - "把外部技能改成 GitHub 索引"
      - "前端设计可以参考哪些外部技能源"
    copy_policy: "internal_lightweight_index"
    notes: "收纳非启航自培养技能和技能源的 GitHub repo 根目录索引；不保留外部技能正文。"

  - id: qihang-workflow-orchestrator
    title: "Qihang Workflow Orchestrator"
    status: internal
    source_type: user_cultivated_workflow_router
    package_path: "skills/qihang-workflow-orchestrator/SKILL.md"
    package_traits:
      - lightweight_workflow_router
      - no_external_code_copy
      - routes_to_underlying_skills
    plugin_distribution: "qihang-skill-pack"
    pipeline_role:
      - "topic_writing_md2wechat"
      - "product_analysis"
    trigger_examples:
      - "跑一下写作发布工作流"
      - "topic 到 writing 到 md2wechat"
      - "产品分析后做前端设计"
      - "产品分析后做投资研报"
      - "产品分析后做 OSS investment"
      - "把跑通的工作流封装成技能"
    copy_policy: "internal_user_cultivated_workflow_skill"
    notes: "封装已确认工作流：topic-writing-md2wechat 和 product-analysis；product-analysis 默认主链是产品+投资视角 -> 研报 -> 可视化，只有用户明确只要文字或前端 brief 时才提前停下。"
