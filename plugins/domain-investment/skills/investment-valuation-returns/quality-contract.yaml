apiVersion: asl-wep/v0.1.0-draft.3
kind: SkillQualityContract
metadata:
  id: investment-valuation-returns.quality
spec:
  builtFrom:
    - SKILL.md
    - references/comps-analysis.md
    - references/initiating-coverage/valuation-methodologies.md
    - references/price-target-range.md
    - references/returns-analysis.md
  obligations:
    - id: valuation-basis-entry-horizon
      requirement: 明确估值日期、币种、期间、当前价格或进入基础、资本结构、净债务口径和目标期限
      required: true
    - id: peer-and-method-selection
      requirement: 解释 DCF、public comps、precedents、LBO 或其他方法的采用、排除、权重和可比性限制
      required: true
    - id: input-lineage-calculation-bridges
      requirement: 所有关键输入连接来源或前序 Artifact，计算从经营指标桥接到企业价值和股权价值
      required: true
    - id: method-reconciliation-scenarios
      requirement: 协调不同估值方法并形成一致的 bull/base/bear 假设、敏感性和主要价值驱动因素
      required: true
    - id: returns-and-exit-reconciliation
      requirement: 企业价值、股权价值、稀释、进入退出路径、期限、IRR 与 MOIC 相互可复核且单位一致
      required: true
    - id: limitations-and-red-flags
      requirement: 估值盲区、外部输入缺口、不可执行分析和会推翻回报结论的红旗被明确记录
      required: true
    - id: missing-information-handling
      requirement: 经合理查找仍不可得的信息必须用业务语言写清缺失事项、不可得原因、对结论的影响、当前保守处理和重新核验条件后继续；方法选择、计算、协调和限制分析仍必须完成
      required: true
  artifact:
    path: 07-valuation-returns.md
    mediaType: text/markdown
    independent: true
