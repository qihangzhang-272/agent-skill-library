version: 1
library: agent-skill-library
principle: "catalog records reusable agent capabilities, source indexes, call chains, and project-init selection guidance"

distribution:
  claude_code_marketplace_manifest: ".claude-plugin/marketplace.json"
  claude_code_plugin_index: "catalog/claude-plugins.json"
  claude_code_plugin_root: "plugins/"
  build_script: "scripts/build-claude-plugins.ps1"
  source_of_truth: "skills/ and catalog/; plugins/ is generated distribution output"

external_sources:
  chinese_natural_voice_revision:
    original_archive: "chinese-natural-voice-revision-universal.zip"
    captured_at: "2026-06-08"
    local_package_path: "skills/chinese-natural-voice-revision"
    license_note: "No standalone license file detected in the supplied archive."
    migrated_scope:
      - "SKILL.md"
      - "AGENTS.md"
      - "skill.json"
      - "agents/openai.yaml"
    vetting:
      risk_level: "low"
      red_flags: "none detected"
      note: "No shell commands, network calls, credential access, eval/exec, base64, or destructive file operations detected."
  anthropic_frontend_design:
    repo: "https://github.com/anthropics/skills"
    mirrored_commit: "c30d329f5814647c1e2f071020c1e8c1c9893ef1"
    upstream_path: "skills/frontend-design"
    local_package_path: "skills/frontend-design"
    license_note: "Apache-2.0 LICENSE.txt copied with the skill package; upstream source is Anthropic's official skills repository."
  oss_investment_scorecard:
    repo: "https://github.com/lucy-cxy/oss-investment-scorecard"
    mirrored_commit: "28a210d0a194ba0f31fe59edaf413abfafa2008e"
    local_package_path: "skills/oss-investment-scorecard"
    license_note: "Upstream README states MIT; GitHub licenseInfo was null because no standalone LICENSE file was detected."
  greensock_gsap_skills:
    repo: "https://github.com/greensock/gsap-skills"
    mirrored_commit: "aed9cfd3277740755f6bfc1155c7aa645403b760"
    local_package_path: "skills/greensock-gsap-skills"
    license_note: "MIT license copied from upstream LICENSE."
    migrated_scope:
      - "upstream skills/ directory"
      - "upstream README.md"
      - "upstream LICENSE"
    excluded_scope:
      - "examples/"
      - "plugin packaging directories"
      - "assets/"
  awesome_design_skills:
    repo: "https://github.com/bergside/awesome-design-skills"
    mirrored_commit: "53c9fe6d8be161e48bcdaa0130d9bd542b1ff755"
    local_package_path: "skills/awesome-design-skills"
    license_note: "MIT license copied from upstream LICENSE."
    migrated_scope:
      - "skills/dashboard"
      - "skills/shadcn"
      - "skills/bento"
      - "skills/premium"
      - "skills/minimal"
      - "skills/index.json"
      - "upstream README.md"
      - "upstream LICENSE"
    excluded_scope:
      - "all other style directories until separately validated"
  typeui_fundamentals:
    repo: "https://github.com/bergside/typeui"
    mirrored_commit: "d4f7713589aa8d4e1486d1d2054eda64929d2be4"
    local_package_path: "skills/typeui-fundamentals"
    license_note: "MIT text copied from upstream LICENSE.md."
    migrated_scope:
      - "skills/fundamentals/SKILL.md"
      - "skills/fundamentals/accessibility.md"
      - "skills/fundamentals/typography-principles.md"
      - "skills/fundamentals/ui-principles.md"
      - "skills/fundamentals/ux-principles.md"
    excluded_scope:
      - "CLI"
      - "plugins/"
      - "MCP server"
      - "registry client implementation"
  frontend_design_candidate_sources:
    research_note: "docs/sections/frontend-design/sources.md"
    prompt_index: "docs/sections/frontend-design/prompt-index.md"
    call_chain: "docs/sections/frontend-design/ui-call-chain.md"
    reviewed_at: "2026-06-08"
    minimum_stars_for_main_list: 1000
    candidates:
      - repo: "https://github.com/bergside/awesome-design-skills"
        license: "MIT"
        stars: 1168
        role: "design skill index and style-skill discovery source"
      - repo: "https://github.com/bergside/typeui"
        license: "MIT text in LICENSE.md; GitHub API reports Other"
        stars: 1081
        role: "design skill CLI and registry candidate"
      - repo: "https://github.com/greensock/gsap-skills"
        license: "MIT"
        stars: 8479
        role: "official GSAP AI skills; first direct migration candidate"
      - repo: "https://github.com/shadcn-ui/ui"
        license: "MIT"
        stars: 115953
        role: "shadcn/ui component and design-system reference"
      - repo: "https://github.com/tailwindlabs/tailwindcss"
        license: "MIT"
        stars: 95441
        role: "Tailwind layout, spacing, responsive, and utility-class reference"
      - repo: "https://github.com/mui/material-ui"
        license: "MIT"
        stars: 98399
        role: "enterprise React UI and Material Design reference"
      - repo: "https://github.com/ant-design/ant-design"
        license: "MIT"
        stars: 98297
        role: "B2B SaaS, dashboard, and enterprise design reference"
      - repo: "https://github.com/motiondivision/motion"
        license: "MIT"
        stars: 32263
        role: "React and JavaScript animation reference"
      - repo: "https://github.com/magicuidesign/magicui"
        license: "MIT"
        stars: 21201
        role: "animated landing-page and design-engineering component reference"
      - repo: "https://github.com/0xeb/TheBigPromptLibrary"
        license: "MIT"
        stars: 5111
        role: "v0 and UI system prompt reference source"
      - repo: "https://github.com/BehiSecc/awesome-claude-skills"
        license: "No license detected"
        stars: 9425
        role: "Claude Skills discovery index; reference only"
      - repo: "https://github.com/2-fly-4-ai/V0-system-prompt"
        license: "No license detected"
        stars: 1812
        role: "v0 system prompt reference link only"

pipelines:
  investment_product_to_research_report:
    title: "投资 / 产品问题到研报"
    workflow_doc: "docs/workflows/investment-product-to-research-report.md"
    sections:
      - investment
      - product
    primary_skills:
      - oss-investment-scorecard
      - ai-product-analyzer
    output_artifacts:
      - "quick note"
      - "case memo"
      - "research report"
      - "IC memo"
      - "DD priority list"
  prd_to_frontend:
    title: "PRD 到前端实现"
    workflow_doc: "docs/workflows/prd-to-frontend.md"
    sections:
      - product
      - frontend-design
      - development-paradigms
    primary_skills:
      - awesome-design-skills-selected-styles
      - typeui-fundamentals
      - greensock-gsap-skills
    output_artifacts:
      - "frontend brief"
      - "page type decision"
      - "design strategy"
      - "component plan"
      - "browser acceptance record"

sections:
  investment:
    title: "投资"
    purpose: "VC 投资评估、融资可行性、IC 论述、DD 优先级"
  product:
    title: "产品"
    purpose: "产品分析、案例研究、场景边界、商业模式和竞争定位"
  writing:
    title: "写作"
    purpose: "中文写作、改写、语气修订、作者声音和文稿自然化"
  frontend-design:
    title: "前端设计"
    purpose: "前端设计、UI/UX、视觉风格、设计提示词和界面生成质量控制"
  technology:
    title: "技术"
    purpose: "技术可行性、AI 基础设施、架构判断、工程风险"
  development-paradigms:
    title: "开发范式"
    purpose: "AI Agent Native 开发流程、TDD、review、调试与收敛机制"
  operations:
    title: "运营"
    purpose: "自动化、知识库同步、投稿、治理和协作流程"

skills:
  - id: oss-investment-scorecard
    title: "OSS Investment Scorecard"
    section: investment
    status: vendored
    source_type: external_skill_repo
    package_path: "skills/oss-investment-scorecard/SKILL.md"
    package_support:
      - "skills/oss-investment-scorecard/references/scored-examples.md"
      - "skills/oss-investment-scorecard/template/evaluation-template.md"
      - "skills/oss-investment-scorecard/cases/"
      - "skills/oss-investment-scorecard/llms.txt"
    upstream_source:
      repo: "https://github.com/lucy-cxy/oss-investment-scorecard"
      commit: "28a210d0a194ba0f31fe59edaf413abfafa2008e"
      original_skill_name: "oss-investment-scorecard"
      replaced_local_skill: "vc-investment-evaluator"
    pipeline_role: "investment_question_to_research_report"
    trigger_examples:
      - "从 VC 视角看这个项目"
      - "这个项目值得投吗"
      - "给这个 AI 开源项目打分"
      - "评估这个项目的投资价值"
      - "这个开源项目值得投吗"
      - "score this open source company"
    copy_policy: "vendored_external_skill"
    notes: "直接迁移 lucy-cxy/oss-investment-scorecard，替代本地临时整理的 vc-investment-evaluator。"
  - id: ai-product-analyzer
    title: "AI Product Analyzer"
    section: product
    status: vendored
    source_type: internal_seed_skill
    package_path: "skills/ai-product-analyzer/SKILL.md"
    package_support:
      - "skills/ai-product-analyzer/references/business-model.md"
      - "skills/ai-product-analyzer/references/data-agent.md"
      - "skills/ai-product-analyzer/references/narrative-audit.md"
    original_source:
      type: "local_seed_skill"
      path: ".claude/skills/ai-product-analyzer"
      captured_at: "2026-06-08"
      source_worktree_state: "untracked"
      ongoing_relationship: false
    package_traits:
      - self_contained
      - no_external_path_dependency
    pipeline_role: "product_analysis_for_investment_and_research_report_chain"
    trigger_examples:
      - "分析一下这个 AI 产品"
      - "这个 AI 产品值得关注吗"
