name: 仓库质量门禁

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ASL Environment 验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout ASL Harness
        uses: actions/checkout@v4
        with:
          repository: qihangzhang-272/asl-harness
          path: .asl-harness-runtime

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ASL Harness
        run: python -m pip install ./.asl-harness-runtime

      - name: Validate Mode-native Environment
        run: asl-harness workspace.validate --workspace .
