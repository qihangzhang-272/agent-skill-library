    copy_policy: "vendored_internal_skill_package"
    notes: "从本地 seed skill 迁移；包内包含 SKILL.md 和三份 references，可独立复制到 .claude/skills 或用户级 skills 目录。原始本地目录只作为导入 provenance，不代表本仓库存在上游依赖。"
